name: Healthcare API CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python Syntax
        run: |
          python -m py_compile backend/app.py

      - name: Build Docker Image
        run: |
          docker build -t healthcare-api:${{ github.sha }} ./backend

      - name: Log in to Amazon ECR
        run: |
          echo "This is where GitHub Actions would authenticate to Amazon ECR."

      - name: Push Docker Image to Amazon ECR
        run: |
          echo "This is where the Docker image would be pushed to Amazon ECR."